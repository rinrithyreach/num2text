<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Num2Text Quiz</title>
  <!-- SVG for modern browsers (follows light/dark tabs); PNG fallback; home-screen icon for iOS -->
  <link rel="icon" href="favicon.png" sizes="32x32" type="image/png">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <!-- Bump ?v= whenever style.css or script.js change, so browsers don't reuse old cached copies -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css?v=9">
  <script>
    // Apply the saved theme before the first paint, so dark mode doesn't flash light on load
    try {
      if ((JSON.parse(localStorage.getItem("num2text-settings")) || {}).theme === "dark") {
        document.documentElement.dataset.theme = "dark";
      }
    } catch {}
  </script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <h1>Num2Text</h1>
        <button id="theme" type="button" class="btn theme-toggle" aria-label="Dark mode" aria-pressed="false" title="Toggle dark mode">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="4.5"/>
            <path d="M12 2v2.5M12 19.5V22M4.93 4.93l1.77 1.77M17.3 17.3l1.77 1.77M2 12h2.5M19.5 12H22M4.93 19.07l1.77-1.77M17.3 6.7l1.77-1.77"/>
          </svg>
          <svg class="moon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
        </button>
      </div>
      <p class="subtitle">Practice writing numbers in words, and words as numbers.</p>
    </header>

    <section class="controls">
      <label class="field">
        <span>Mode</span>
        <select id="mode">
          <option value="random">Random</option>
          <option value="num2words">Number → Words</option>
          <option value="words2num">Words → Number</option>
        </select>
      </label>
      <label class="field">
        <span>Range</span>
        <select id="range">
          <option value="100">0 – 100</option>
          <option value="1000" selected>0 – 1,000</option>
          <option value="100000">0 – 100,000</option>
          <option value="999999999">0 – 999,999,999</option>
        </select>
      </label>
      <label class="field">
        <span>Timer</span>
        <span class="switch">
          <input id="timer" type="checkbox" role="switch" autocomplete="off">
          <span class="switch-track"></span>
          <span id="timer-state" class="switch-label">Off</span>
        </span>
      </label>
    </section>

    <section class="score">
      <div class="stat good"><span class="stat-label">Correct</span><span id="correct" class="stat-value">0</span></div>
      <div class="stat bad"><span class="stat-label">Wrong</span><span id="wrong" class="stat-value">0</span></div>
      <div class="stat streak">
        <span class="stat-label">Streak</span>
        <span class="stat-row"><span id="streak" class="stat-value">0</span><span id="best" class="stat-best">Best 0</span></span>
      </div>
    </section>

    <section class="card">
      <div id="timer-box" class="timer" hidden>
        <div class="timer-track"><div id="timer-bar" class="timer-bar"></div></div>
        <span id="timer-text" class="timer-text">0s</span>
      </div>

      <p id="instruction" class="instruction">Write this number in words:</p>
      <div id="question" class="question">0</div>

      <form id="answer-form" class="answer-form" autocomplete="off">
        <input id="answer" type="text" placeholder="Type your answer…" aria-label="Your answer">
        <button id="submit" type="submit" class="btn primary">Submit</button>
        <button id="next" type="button" class="btn primary" hidden>Next →</button>
      </form>

      <!-- Shown in place of the hint once answered; the typed answer stays visible in the input -->
      <div id="feedback" class="feedback" hidden>
        <p id="result" class="result"></p>
        <p class="answer-line">Correct answer: <strong id="correct-answer"></strong></p>
      </div>

      <p class="hint">Press <kbd>Enter</kbd> to submit, then <kbd>Enter</kbd> again for the next question.</p>
    </section>

    <button id="reset" type="button" class="btn link">Reset score</button>
  </main>

  <script src="script.js?v=7"></script>
</body>
</html>
