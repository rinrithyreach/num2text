<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Num2Text Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Num2Text</h1>
      <p class="subtitle">Practice writing numbers in words, and words as numbers.</p>
    </header>

    <section class="controls">
      <label class="field">
        <span>Mode</span>
        <select id="mode">
          <option value="random">Random</option>
          <option value="num2words">Number → Words</option>
          <option value="words2num">Words → Number</option>
        </select>
      </label>
      <label class="field">
        <span>Range</span>
        <select id="range">
          <option value="100">0 – 100</option>
          <option value="1000" selected>0 – 1,000</option>
          <option value="100000">0 – 100,000</option>
          <option value="999999999">0 – 999,999,999</option>
        </select>
      </label>
    </section>

    <section class="score">
      <div class="stat"><span class="stat-label">Correct</span><span id="correct" class="stat-value good">0</span></div>
      <div class="stat"><span class="stat-label">Wrong</span><span id="wrong" class="stat-value bad">0</span></div>
      <div class="stat"><span class="stat-label">Streak</span><span id="streak" class="stat-value">0</span></div>
    </section>

    <section class="card">
      <p id="instruction" class="instruction">Write this number in words:</p>
      <div id="question" class="question">0</div>

      <form id="answer-form" class="answer-form" autocomplete="off">
        <input id="answer" type="text" placeholder="Type your answer…" aria-label="Your answer">
        <button id="submit" type="submit" class="btn primary">Submit</button>
      </form>

      <div id="feedback" class="feedback" hidden>
        <p id="result" class="result"></p>
        <p class="answer-line">Correct answer: <strong id="correct-answer"></strong></p>
        <p class="answer-line muted">Your answer: <span id="your-answer"></span></p>
        <button id="next" type="button" class="btn">Next question →</button>
      </div>

      <p class="hint">Press <kbd>Enter</kbd> to submit, then <kbd>Enter</kbd> again for the next question.</p>
    </section>

    <button id="reset" type="button" class="btn link">Reset score</button>
  </main>

  <script src="script.js"></script>
</body>
</html>
